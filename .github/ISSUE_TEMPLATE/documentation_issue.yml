name: Documentation issue
description: Report an error, gap or unclear content in the mooDesk documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation.

  - type: input
    id: page
    attributes:
      label: Page URL
      description: Link to the page on https://support.moodesk.io that this issue refers to.
      placeholder: "https://support.moodesk.io/..."
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of issue
      options:
        - Incorrect or outdated information
        - Missing information
        - Unclear or confusing content
        - Broken link or formatting
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: If you know how it should read, tell us. Pull requests are welcome too.
