name: Feature request
description: Suggest an idea or improvement for mooDesk.
title: "[Feature]: "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. This issue will be public: please do not include
        confidential information about your organisation or users.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to achieve, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like mooDesk to behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples or links that help explain the request.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this feature has not been requested yet.
          required: true
